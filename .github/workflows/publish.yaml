name: Publicar con Bun en GitHub Packages

on:
  push:
    branches: [ main ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependencias y compilar
        run: |
          bun install
          bun run build

      - name: Configurar autenticación para GitHub Packages
        run: |
          echo "@javer-ia-nos:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      - name: Publicar en GitHub Packages
        run: |
          bun publish --registry https://npm.pkg.github.com --tolerate-republish