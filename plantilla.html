                          <span class="font-headline-sm text-body-md text-on-surface">MacBook Pro 16"</span>
                          <span class="px-2 py-0.5 bg-secondary/20 text-secondary rounded-full font-label-caps text-label-caps">Actual</span>
                        </div>
                        <div class="font-label-code text-body-sm text-on-surface-variant">IP: 181.61.204.18 · TLS 1.3</div>
                      </div>
                    </div>
                  </div>
                  <div class="bg-surface-container-high p-4 rounded-2xl flex items-center justify-between">
                    <div class="flex items-center gap-3">
                      <div class="w-10 h-10 rounded-xl bg-surface-container flex items-center justify-center text-tertiary">
                        <span class="material-symbols-outlined">smartphone</span>
                      </div>
                      <div>
                        <div class="flex items-center gap-2">
                          <span class="font-headline-sm text-body-md text-on-surface">iPhone 15 Pro</span>
                          <span class="px-2 py-0.5 bg-surface-container text-on-surface-variant rounded-full font-label-caps text-label-caps">FaceID</span>
                        </div>
                        <div class="font-label-code text-body-sm text-on-surface-variant">UDID: 8841-A92B</div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div class="lg:col-span-7 bg-surface-container rounded-3xl p-6 flex flex-col justify-between shadow-xl">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-4">
                  <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-secondary">terminal</span>
                    <h3 class="font-headline-sm text-headline-sm text-on-surface">Registro Inmutable de Eventos (ASR-03)</h3>
                  </div>
                  <span class="font-label-caps text-label-caps text-secondary uppercase">Live Sink</span>
                </div>
                <div class="overflow-x-auto">
                  <table class="w-full text-left font-body-sm">
                    <thead class="font-label-code text-on-surface-variant bg-surface-container-high">
                      <tr>
                        <th class="p-3">Marca Temporal</th>
                        <th class="p-3">Evento</th>
                        <th class="p-3 text-right">Resultado</th>
                      </tr>
                    </thead>
                    <tbody class="font-label-code text-body-sm">
                      <tr class="hover:bg-surface-container-high/40">
                        <td class="p-3 text-on-surface-variant">2025-05-18 10:44:12</td>
                        <td class="p-3"><span class="text-secondary">CU-12</span> Apertura CDT #9941</td>
                        <td class="p-3 text-right"><span class="px-2 py-0.5 bg-secondary-container/30 text-secondary rounded-full font-label-caps text-label-caps">SUCCESS 200</span></td>
                      </tr>
                      <tr class="hover:bg-surface-container-high/40">
                        <td class="p-3 text-on-surface-variant">2025-05-18 09:12:05</td>
                        <td class="p-3"><span class="text-on-surface">CU-15</span> Autenticación OAuth2 / JWT</td>
                        <td class="p-3 text-right"><span class="px-2 py-0.5 bg-secondary-container/30 text-secondary rounded-full font-label-caps text-label-caps">SUCCESS 200</span></td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </section>
        )}

        {/* TAB 4: CRM / PQRS */}
        {currentTab === 'crm' && (
          <section class="flex flex-col gap-8">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <div class="lg:col-span-6 bg-surface-container rounded-3xl p-8 flex flex-col gap-6 shadow-xl">
                <div>
                  <span class="font-label-caps text-label-caps text-secondary uppercase tracking-wider">CU-04: Módulo CRM &amp; Defensoría</span>
                  <h2 class="font-headline-lg text-headline-lg text-on-surface">Radicar Reclamación o PQRS</h2>
                </div>
                <form class="flex flex-col gap-4" onSubmit={handlePqrs}>
                  <div>
                    <label class="font-headline-sm text-body-md text-on-surface">Tipo de Solicitud</label>
                    <select class="w-full mt-1.5 p-3.5 bg-surface-container-low rounded-xl text-on-surface font-body-md focus:outline-none" value={pqrsType} onChange={e => setPqrsType(e.target.value)}>
                      <option value="transaccion_no_reconocida">Transacción No Reconocida (CU-05)</option>
                      <option value="cobro_indebido">Revisión de Cobros o Comisiones</option>
                      <option value="falla_tecnica">Incidencia en Plataforma</option>
                      <option value="felicitacion_peticion">Petición General o Consulta</option>
                    </select>
                  </div>
                  <div>
                    <label class="font-headline-sm text-body-md text-on-surface">Descripción Detallada</label>
                    <textarea class="w-full mt-1.5 p-3.5 bg-surface-container-low rounded-xl text-on-surface font-body-md focus:outline-none resize-none" rows="4" placeholder="Describa el motivo..." required value={pqrsDesc} onChange={e => setPqrsDesc(e.target.value)}></textarea>
                  </div>
                  <button class="w-full py-4 rounded-2xl bg-secondary text-on-secondary font-headline-sm text-body-md hover:bg-secondary-fixed transition-all flex items-center justify-center gap-2 shadow-lg mt-2" type="submit">
                    <span class="material-symbols-outlined">send</span>
                    <span>Generar Radicado Único y Notificar</span>
                  </button>
                </form>
              </div>

              {/* Virtual Assistant Chat (CU-02) */}
              <div class="lg:col-span-6 bg-surface-container rounded-3xl p-6 flex flex-col justify-between shadow-xl">
                <div class="flex items-center justify-between pb-3">
                  <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-full bg-secondary-container flex items-center justify-center text-secondary">
                      <span class="material-symbols-outlined text-xl">smart_toy</span>
                    </div>
                    <div>
                      <span class="font-headline-sm text-body-md text-on-surface">Asesor Virtual Javer-IA (CU-02)</span>
                      <div class="flex items-center gap-1.5 font-label-code text-body-sm text-secondary">
                        <span class="w-1.5 h-1.5 rounded-full bg-secondary"></span>
                        <span>En línea 24/7</span>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="flex flex-col gap-2.5 py-3 overflow-y-auto max-h-44 pr-1">
                  <div class="self-start max-w-[85%] bg-surface-container-high p-3 rounded-2xl rounded-tl-sm text-body-sm text-on-surface">
                    ¡Hola Sara! Veo que revisas tu portafolio financiero. ¿Deseas asesoría personalizada para tu radicado PQRS o sobre la tasa de tu CDT?
                  </div>
                </div>
                <div class="pt-2 flex items-center gap-2">
                  <input class="flex-1 bg-surface-container-low p-3 rounded-xl text-on-surface font-body-md focus:outline-none text-body-sm" placeholder="Escribe tu consulta al Asesor Virtual..." type="text"/>
                  <button class="p-3 bg-secondary text-on-secondary rounded-xl hover:bg-secondary-fixed transition-colors flex items-center justify-center" onClick={() => alert("Mensaje procesado por el modelo LLM Javer-IA...")} type="button">
                    <span class="material-symbols-outlined text-lg">send</span>
                  </button>
                </div>
              </div>
            </div>
          </section>
        )}
      </div>
    );
  }

  // Root Application Component
  function App() {
    return (
      <MemoryRouter initialEntries={["/"]}>
        <Header />
        <main class="w-full pt-20 bg-background flex-1 max-w-7xl mx-auto px-6 lg:px-12 py-space-lg">
          <Routes>
            <Route path="/" element={<InicioCuentasScreen />} />
            <Route path="/inicio-cuentas" element={<InicioCuentasScreen />} />
            <Route path="/transacciones-pagos" element={<TransaccionesPagosScreen />} />
            <Route path="/tarjetas-creditos" element={<TarjetasCreditosScreen />} />
            <Route path="/inversiones-financiero" element={<InversionesFinancieroScreen defaultTab="cdt" />} />
            <Route path="/auditoria-seguridad-crm" element={<InversionesFinancieroScreen defaultTab="audit" />} />
          </Routes>
        </main>
        <Footer />
      </MemoryRouter>
    );
  }

  const rootElement = document.getElementById("root");
  const root = createRoot(rootElement);
  root.render(<App />);
</script>

</body>
</html>
